line-length = 120
target-version = "py311"

[lint]
select = ["E", "F"]
ignore = [
    "E402", "E741", "E702", "F811", "F821", "F401", "E701", "E722",
    "F841", "F541", "E401", "E712", "E501", "UP"
]

[lint.per-file-ignores]
"backend/tests/*" = [
    "E402", "F401", "F811", "F821", "E741", "E702", "F841", "E701",
    "E722", "F541", "E712", "E501"
]
